name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/team-ops-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/team-ops-api:latest
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/team-ops-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/team-ops-web:latest

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build -w @team-ops/mcp
      - run: npm publish --access public
        working-directory: apps/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run build -w @team-ops/setup
      - run: npm publish --access public
        working-directory: apps/setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
