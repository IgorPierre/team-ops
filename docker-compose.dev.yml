services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
      POSTGRES_DB: teamops
    ports:
      - "5432:5432"
    volumes:
      - teamops_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops -d teamops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamops_pg_dev:
