services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamops}
      POSTGRES_DB: teamops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the api container talks to the database.
    # Use `docker compose exec postgres psql -U teamops` (or make backup) to reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops -d teamops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      # Always use the compose service hostname. Host `.env` DATABASE_URL
      # (localhost) is for `make api-dev`, not for this container.
      DATABASE_URL: postgres://teamops:${POSTGRES_PASSWORD:-teamops}@postgres:5432/teamops?sslmode=disable
      HTTP_ADDR: :8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Loopback only. Browsers and coding agents go through the web app, which
    # proxies /v1 and /healthz — point agents at the same URL people open.
    # Set API_BIND=0.0.0.0 to expose the API port directly.
    ports:
      - "${API_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_API_BASE: /v1
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_BASE: /v1
      # Public URL; the hosted MCP endpoint (APP_URL/mcp) advertises it for OAuth.
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
