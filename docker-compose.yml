services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
      POSTGRES_DB: teamops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops -d teamops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      # Always use the compose service hostname. Host `.env` DATABASE_URL
      # (localhost) is for `make api-dev`, not for this container.
      DATABASE_URL: postgres://teamops:teamops@postgres:5432/teamops?sslmode=disable
      HTTP_ADDR: :8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ON_START: ${SEED_ON_START:-false}
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_API_BASE: /v1
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_BASE: /v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
